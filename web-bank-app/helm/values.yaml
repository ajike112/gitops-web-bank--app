replicaCount: 2

# Runtime environment passed to the app as NODE_ENV
nodeEnv: production

image:
  repository: 536697262404.dkr.ecr.us-east-1.amazonaws.com/jenkins-app-repo
  tag: "79"                # Jenkins updates this automatically
  pullPolicy: IfNotPresent

# When enabled, the HPA owns the replica count and the Deployment omits
# `replicas`, so ArgoCD self-heal doesn't fight the autoscaler.
# replicaCount is only used when autoscaling is disabled.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# ClusterIP: external traffic enters via the ALB Ingress (target-type: ip
# routes straight to pod IPs), so a separate cloud load balancer isn't needed.
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Health checks. Path "/" matches the ALB health check in ingress.yaml.
probes:
  path: /
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
