apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: web-bank-app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  provider: aws
  # Mirror the mounted secret into a Kubernetes Secret so it can be used as an
  # env var. Requires the CSI driver to be installed with syncSecret.enabled=true.
  secretObjects:
    - secretName: web-bank-app-secrets
      type: Opaque
      data:
        - objectName: db-password
          key: db-password
  parameters:
    region: "us-east-1"
    objects: |
      - objectName: "web-bank-app-db-password"
        objectType: "secretsmanager"
        objectAlias: "db-password"
