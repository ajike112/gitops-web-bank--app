apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: web-bank-app-secrets
spec:
  provider: aws
  parameters:
    region: us-east-1
    # roleArn: arn:aws:iam::<ACCOUNT_ID>:role/<IRSA_ROLE_NAME>   # uncomment if using IRSA
    objects: |
      - objectName: "web-bank-app-db-password"
        objectType: "secretsmanager"
        objectAlias: "db-password"
