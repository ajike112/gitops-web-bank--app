apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: web-bank-app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  provider: aws
  parameters:
    region: "us-east-1"
    objects: |
      - objectName: "web-bank-app-db-password"
        objectType: "secretsmanager"
        objectAlias: "db-password"
