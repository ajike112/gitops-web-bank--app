apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-bank-app
  labels:
    app: web-bank-app
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web-bank-app
  template:
    metadata:
      labels:
        app: web-bank-app
    spec:
      serviceAccountName: web-bank-app-sa
      containers:
        - name: web-bank-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
          env:
            - name: NODE_ENV
              value: {{ .Values.nodeEnv | quote }}
            # Synced from AWS Secrets Manager by the CSI driver (see secret-provider.yaml)
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-bank-app-secrets
                  key: db-password
          envFrom:
            - configMapRef:
                name: web-bank-app-config
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "web-bank-app-secrets"
