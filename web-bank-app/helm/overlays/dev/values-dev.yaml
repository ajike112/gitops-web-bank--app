replicaCount: 1
nodeEnv: development

# Image tag is inherited from the base values.yaml (updated by Jenkins).
# Helm does not expand ${ENV_VARS}, so don't put placeholders here.
image:
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
