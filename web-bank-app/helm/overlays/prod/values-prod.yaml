replicaCount: 3
nodeEnv: production

# Image tag is inherited from the base values.yaml (updated by Jenkins).
# Helm does not expand ${ENV_VARS}, so don't put placeholders here.
image:
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi
