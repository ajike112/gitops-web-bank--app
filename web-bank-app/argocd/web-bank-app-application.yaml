
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-bank-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ajike112/gitops-web-bank-app.git
    targetRevision: main
    path: web-bank-app/helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: web-bank-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
